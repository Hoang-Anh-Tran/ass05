version: '3.9'

services:

  # ==================== Infrastructure ====================

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Auth Service ====================

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "4012:4000"
    environment:
      - JWT_SECRET_KEY=bookstore-jwt-secret-key-2024
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ==================== API Gateway ====================

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "4000:4000"
    environment:
      - JWT_SECRET_KEY=bookstore-jwt-secret-key-2024
    depends_on:
      - auth-service
      - customer-service
      - book-service
      - cart-service
      - staff-service
      - manager-service
      - catalog-service
      - order-service
      - ship-service
      - pay-service
      - comment-rate-service
      - recommender-ai-service

  # ==================== Business Services ====================

  customer-service:
    build: ./customer-service
    container_name: customer-service
    ports:
      - "4001:4000"

  book-service:
    build: ./book-service
    container_name: book-service
    ports:
      - "4002:4000"

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports:
      - "4003:4000"

  staff-service:
    build: ./staff-service
    container_name: staff-service
    ports:
      - "4004:4000"

  manager-service:
    build: ./manager-service
    container_name: manager-service
    ports:
      - "4005:4000"

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    ports:
      - "4006:4000"

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "4007:4000"
    volumes:
      - ./shared:/shared
    environment:
      - PYTHONPATH=/shared
    depends_on:
      rabbitmq:
        condition: service_healthy

  ship-service:
    build: ./ship-service
    container_name: ship-service
    ports:
      - "4008:4000"

  pay-service:
    build: ./pay-service
    container_name: pay-service
    ports:
      - "4009:4000"

  comment-rate-service:
    build: ./comment-rate-service
    container_name: comment-rate-service
    ports:
      - "4010:4000"

  recommender-ai-service:
    build: ./recommender-ai-service
    container_name: recommender-ai-service
    ports:
      - "4011:4000"

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
